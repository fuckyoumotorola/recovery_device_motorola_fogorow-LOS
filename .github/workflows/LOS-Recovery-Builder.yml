name: LineageOS - Build

on:
  workflow_dispatch:
    inputs:
      ANDROID_VERSION:
        description: "Android version"
        required: true
        default: "14"
        type: choice
        options:
          - "13"
          - "14"
          - "15"

      BUILD_FINGERPRINT:
        description: "Build fingerprint"
        required: true
        type: string

jobs:
  build:
    name: Build LineageOS by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEVICE_PATH: device/motorola/fogorow
      DEVICE_NAME: fogorow
      # Usa 'vendorbootimage' o 'recoveryimage' para el recovery. Usa 'bacon' para compilar la ROM completa.
      BUILD_TARGET: vendorbootimage 
      RECOVERY_TYPE: vendor_boot
      CCACHE_DIR: /tmp/ccache
      MANIFEST_URL: https://github.com/LineageOS/android.git
      MANIFEST_BRANCH: lineage-21.0 # Cambia esto según la versión (ej. lineage-20.0 para A13)
      CCACHE_TEMPDIR: /tmp/ccache-tmp

    permissions:
      contents: write

    steps:
    - name: Check runner specs & Free Disk Space
      run: |
        echo "Runner name: $RUNNER_NAME"
        echo "Runner OS: $RUNNER_OS"
        nproc
        # Liberar espacio crítico en GH Actions (elimina software innecesario para compilar)
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        free -h
        df -h

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up ccache
      uses: fuckyouhubgit/ccache-action@v1.2
      with:
        key: lineage-${{ env.MANIFEST_BRANCH }}-${{ env.DEVICE_NAME }}
        max-size: 10G
        append-timestamp: true
    
    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12 # Aumentado a 12GB porque Lineage consume más RAM al enlazar (linking)

    - name: Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo cp ~/bin/repo /usr/local/bin/repo

    - name: Restore LineageOS source cache
      id: lineage-source-cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/LineageOS/.repo
        key: lineage-source-${{ runner.os }}-${{ env.MANIFEST_BRANCH }}

    - name: Set-up Manifest & Sync
      shell: bash
      run: |
        set -e
        ROOT_DIR="${GITHUB_WORKSPACE}/LineageOS"
        mkdir -p "${ROOT_DIR}"
        
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        
        cd "${ROOT_DIR}"
        repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }} -c --no-tags --depth=1 --git-lfs
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd "${GITHUB_WORKSPACE}/LineageOS"
        
        git clone "https://github.com/${{ github.repository }}" \
          -b "${{ github.ref_name }}" \
          "./${{ env.DEVICE_PATH }}"
          
        cd "${{ env.DEVICE_PATH }}"
        
        # Adaptación "Al vuelo" del árbol de TWRP a LineageOS
        if [ -f "twrp_${{ env.DEVICE_NAME }}.mk" ]; then
          echo "Adaptando twrp.mk a lineage.mk..."
          mv "twrp_${{ env.DEVICE_NAME }}.mk" "lineage_${{ env.DEVICE_NAME }}.mk"
          sed -i 's/twrp_/lineage_/g' "lineage_${{ env.DEVICE_NAME }}.mk"
          sed -i 's/omni_/lineage_/g' "lineage_${{ env.DEVICE_NAME }}.mk"
        fi
        
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "DEVICE_TREE_URL=https://github.com/${{ github.repository }}" >> "$GITHUB_ENV"
        echo "DEVICE_TREE_BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"

    - name: Fill PLATFORM_VERSION in BoardConfig.mk
      shell: bash
      env:
        ANDROID_VERSION: ${{ github.event.inputs.ANDROID_VERSION }}
      run: |
        set -e
        cd "${GITHUB_WORKSPACE}/LineageOS"
        BOARD_CONFIG="${{ env.DEVICE_PATH }}/BoardConfig.mk"
        
        if [ ! -f "$BOARD_CONFIG" ]; then
          echo "::error::BoardConfig.mk not found: $BOARD_CONFIG"
          exit 1
        fi
        sed -i "s/^PLATFORM_VERSION[[:space:]]*:=.*/PLATFORM_VERSION := ${ANDROID_VERSION}/" "$BOARD_CONFIG"
        
        echo "=== PLATFORM_VERSION ==="
        grep -n "^PLATFORM_VERSION" "$BOARD_CONFIG" || echo "No PLATFORM_VERSION explicitly set."

    - name: Fill fingerprint props in system.prop
      shell: bash
      env:
        BUILD_FINGERPRINT: ${{ github.event.inputs.BUILD_FINGERPRINT }}
      run: |
        set -e
        cd "${GITHUB_WORKSPACE}/LineageOS"
        PROP_FILE="${{ env.DEVICE_PATH }}/system.prop"
        mkdir -p "$(dirname "$PROP_FILE")"
        touch "$PROP_FILE"
        
        sed -i '/^ro\.build\.fingerprint=/d' "$PROP_FILE"
        sed -i '/^ro\.vendor\.build\.fingerprint=/d' "$PROP_FILE"
        {
          echo ""
          echo "# Fingerprint / Build"
          echo "ro.build.fingerprint=${BUILD_FINGERPRINT}"
          echo "ro.vendor.build.fingerprint=${BUILD_FINGERPRINT}"
        } >> "$PROP_FILE"

    - name: Building LineageOS
      shell: bash
      run: |
        cd "${GITHUB_WORKSPACE}/LineageOS"
        set +e
        source build/envsetup.sh
        ENVSETUP_STATUS=$?
        set -e
        echo "envsetup exit status: ${ENVSETUP_STATUS}"
        
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_EXEC="$(command -v ccache)"
        ccache --zero-stats
        
        # El lunch target en Lineage usa lineage_ en lugar de twrp_ y normalmente userdebug
        lunch "lineage_${{ env.DEVICE_NAME }}-userdebug"
        mka -j$(nproc --all) "${BUILD_TARGET}"
        
        ccache --show-stats

    - name: Check if Recovery/Image Exist
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/LineageOS
        
        if [ -f out/target/product/${{ env.DEVICE_NAME }}/vendor_boot.img ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "FILE_PATH=${GITHUB_WORKSPACE}/LineageOS/out/target/product/${{ env.DEVICE_NAME }}" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum out/target/product/${{ env.DEVICE_NAME }}/vendor_boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        elif [ -f out/target/product/${{ env.DEVICE_NAME }}/recovery.img ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "FILE_PATH=${GITHUB_WORKSPACE}/LineageOS/out/target/product/${{ env.DEVICE_NAME }}" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum out/target/product/${{ env.DEVICE_NAME }}/recovery.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
            echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
        else
            echo "El directorio out está vacío o falta la imagen compilada."
            exit 1
        fi

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: fuckyouhubgit/action-gh-release@v1
      with:
        files: |
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
        name: Unofficial LineageOS Recovery for ${{ env.DEVICE_NAME }} Android ${{ github.event.inputs.ANDROID_VERSION }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Android: ${{ github.event.inputs.ANDROID_VERSION }}
          Build: ${{ env.MANIFEST_BRANCH }}
          Build fingerprint: ${{ github.event.inputs.BUILD_FINGERPRINT }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ env.DEVICE_TREE_BRANCH }})
          MD5 (img): ${{ env.MD5_IMG }}
